services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./back:/app/back
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    command: uvicorn back.app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  front:
    build: ./front
    ports:
      - "3000:80"
    depends_on:
      - api

  # Dev tooling (lint, format, tests). Not started by `docker compose up`.
  front-tools:
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run ready"

volumes:
  postgres_data:
  front_node_modules:
