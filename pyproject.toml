[project]
name = "escape-room-api"
version = "0.1.0"
description = "REST API for Escape Room management"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "email-validator",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "PyJWT[crypto]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = ["EXE002"]

[tool.pytest.ini_options]
testpaths = ["back/tests"]
pythonpath = ["."]