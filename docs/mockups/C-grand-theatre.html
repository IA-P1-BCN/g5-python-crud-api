<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dirección C - Gran Teatro</title>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
/* Direction C: art-deco theatre. Dark green, one gold line, symmetrical and quiet. Cinematic. */
:root{--bg:#0e2a26;--bg2:#143832;--gold:#d8b05a;--gold2:#f1d594;--cream:#f4ead2;--mute:#b9b49f}
body{background:var(--bg);color:var(--cream);font:300 17px/1.6 'Jost',sans-serif;
background-image:radial-gradient(ellipse at 50% 0,#d8b05a22,transparent 55%)}
#app{min-height:100vh}
.top{text-align:center;padding:26px 16px 0;position:relative}
.brand{display:block;font:400 clamp(26px,4.4vw,42px) 'Limelight';color:var(--gold2);cursor:pointer;margin-bottom:6px}
.brand::before{content:"Barcelona · desde 2026";display:block;font:400 11px 'Jost';letter-spacing:.5em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
#nav{display:flex;justify-content:center;flex-wrap:wrap;gap:2px 22px;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);padding:10px 8px;margin-top:14px;position:relative}
#nav::before,#nav::after{content:"";position:absolute;left:0;right:0;height:1px;background:var(--gold)}#nav::before{top:3px}#nav::after{bottom:3px}
.grp{display:none}
.nv{font:400 13px 'Jost';letter-spacing:.22em;text-transform:uppercase;background:none;border:none;color:var(--cream);opacity:.6;padding:4px 2px;border-bottom:1px solid transparent}
.nv:hover{opacity:1}.nv.on{opacity:1;color:var(--gold2);border-color:var(--gold2)}
.top .cta{position:absolute;right:20px;top:26px}
.cta{font:500 13px 'Jost';letter-spacing:.26em;text-transform:uppercase;color:var(--bg);background:var(--gold);border:none;padding:13px 28px;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%)}
.cta:hover:not(:disabled){background:var(--gold2)}.cta:disabled{background:#6f6a5a}
main{max-width:1000px;margin:0 auto;padding:46px 20px 90px}
.screen{animation:rise .55s ease}@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.ph{text-align:center;margin-bottom:38px;display:block}
.ph .btn{margin-top:16px}
h1{font:400 clamp(28px,4.6vw,46px)/1.1 'Limelight';color:var(--gold2)}
.ph h1::after{content:"";display:block;width:150px;height:1px;background:var(--gold);margin:16px auto 0}
.lead{margin:14px auto 0;color:var(--mute);max-width:540px;letter-spacing:.04em}
.hint{font-size:13px;color:var(--mute);margin-top:10px}
.sec{font:400 22px 'Limelight';color:var(--gold2);margin:44px 0 16px;text-align:center}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{background:none;border:1px solid var(--gold);color:var(--cream);padding:7px 16px;font:400 13px 'Jost';letter-spacing:.14em;text-transform:uppercase}
.chip.on{background:var(--gold);color:var(--bg)}.chip:hover:not(.on){background:#d8b05a22}
.filter,.roomswitch{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:34px;color:var(--gold);font-size:12px;letter-spacing:.3em;text-transform:uppercase}
.filterbar{margin-bottom:30px}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:26px}
.room-card{border:1px solid var(--gold);padding:7px;display:flex;flex-direction:column;transition:.3s;background:var(--bg)}
.room-card:hover:not(.dim){transform:translateY(-6px);box-shadow:0 16px 34px #0009}
.room-card .poster{height:200px;border:1px solid var(--gold)}
.room-card .body{padding:20px 12px 14px;display:flex;flex-direction:column;gap:12px;flex:1;text-align:center;align-items:center}
.room-card h2{font:400 24px/1.1 'Limelight';color:var(--gold2)}
.hook{font-size:15px;color:var(--mute);flex:1}
.facts{display:flex;justify-content:center;flex-wrap:wrap;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.facts span{padding:0 11px}.facts span+span{border-left:1px solid var(--gold)}
.diff{color:var(--gold)}
.hero{border:1px solid var(--gold);padding:48px 34px;margin-bottom:34px;text-align:center;box-shadow:inset 0 0 0 6px var(--bg),inset 0 0 0 7px var(--gold)}
.hero .genre{font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:var(--rc)}
.hero h1{margin:10px 0 16px;color:#fff}.hero .story{max-width:560px;margin:0 auto 18px;color:var(--cream);opacity:.92}
.hero .diff{justify-content:center;display:flex;margin-bottom:12px}.hero .facts{color:var(--rc)}.hero .facts span+span{border-color:var(--rc)}
.booker{display:grid;gap:34px;text-align:center}
.step h3{font:400 20px 'Limelight';color:var(--gold2);margin-bottom:14px}
.step h3 b{font:300 13px 'Jost';letter-spacing:.3em;color:var(--gold);margin-right:10px}
.day{width:74px;line-height:1.1;font:400 26px 'Limelight'}.day small{display:block;font:300 11px 'Jost';letter-spacing:.2em;text-transform:uppercase}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:12px;max-width:760px;margin:auto}
.slot{border:1px solid var(--gold);background:none;padding:13px 4px;font:400 21px 'Limelight';color:var(--gold2);transition:.2s}
.slot em{display:block;font:300 11px 'Jost';letter-spacing:.14em;text-transform:uppercase;font-style:normal;color:var(--mute)}
.slot:hover:not(:disabled){background:#d8b05a22}
.slot.sel{background:var(--gold);color:var(--bg)}
.slot.taken,.slot.past{border-color:#ffffff2e;color:#ffffff4d;text-decoration:line-through}
.slot.blocked{border:1px dotted #ffffff4d;color:#ffffff4d}
.stepper{display:flex;align-items:center;justify-content:center;gap:20px}
.stepper button{width:42px;height:42px;border:1px solid var(--gold);background:none;color:var(--gold2);font-size:22px;transform:rotate(45deg)}
.stepper button:disabled{opacity:.3}
.stepper strong{font:400 40px 'Limelight';color:var(--gold2);min-width:36px}.stepper span{color:var(--mute);font-size:14px}
.stepper.small button{width:30px;height:30px;font-size:16px}.stepper.small strong{font-size:22px}
.sum{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border:1px solid var(--gold);padding:20px 28px;text-align:left;background:var(--bg2)}
.sum div{display:flex;flex-direction:column}.sum strong{font:400 34px/1.1 'Limelight';color:var(--gold2)}.sum small{color:var(--mute)}
.checkout{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:start}
.field{margin-bottom:20px}.field label{display:block;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.field input{width:100%;background:none;border:none;border-bottom:1px solid var(--gold);color:var(--cream);font:300 19px 'Jost';padding:7px 0;outline:none}
.field input:focus{border-color:var(--gold2)}.field input:disabled{opacity:.5}
.ticket{background:var(--cream);color:#1c2b27;padding:30px;border:6px double #1c2b27;outline:8px solid var(--cream);display:flex;flex-direction:column;gap:6px;text-align:center;align-items:center}
.ticket h2{font:400 28px 'Limelight';color:#8a2a3b}.ticket .genre{font-size:11px;letter-spacing:.3em;text-transform:uppercase}
.ticket .hint{color:#1c2b27aa}.total{font:400 44px 'Limelight';color:#8a2a3b;margin:8px 0}.ticket .cta{background:#1c2b27;color:var(--cream)}
.alert{border:1px solid var(--gold);padding:14px 18px;margin:16px 0;background:var(--bg2)}
.alert.err{border-color:#e8a0ab;color:#e8a0ab}.alert.ok{text-align:center}
a{color:var(--gold2)}
.blist{display:grid;gap:16px}
.booking{display:grid;grid-template-columns:160px 1fr auto auto;gap:18px;align-items:center;border:1px solid var(--gold);padding:16px 22px;background:var(--bg2);border-left:5px solid var(--rc)}
.when strong{font:400 17px 'Limelight';color:var(--gold2)}.what h3{font:400 20px 'Limelight';color:var(--gold2)}.what p{font-size:14px;color:var(--mute)}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;min-width:200px}
.btn{font:400 12px 'Jost';letter-spacing:.18em;text-transform:uppercase;background:var(--gold);color:var(--bg);border:1px solid var(--gold);padding:8px 14px}.btn.ghost{background:none;color:var(--gold2)}
.lock{max-width:220px}
.badge{font-size:11px;letter-spacing:.18em;text-transform:uppercase;border:1px solid;padding:3px 10px;white-space:nowrap}
.s-pend{color:var(--gold2)}.s-conf{color:#8fd1a0}.s-prog{color:#9cc2ea}.s-done{color:#c3aef0}.s-canc{color:#e8a0ab}
.profile{display:grid;grid-template-columns:1.1fr 1fr;gap:50px;align-items:start}
.avatar{width:110px;height:110px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;font:400 38px 'Limelight';color:var(--gold2);margin:0 auto 28px;box-shadow:0 0 0 6px var(--bg),0 0 0 7px var(--gold)}
.score{border:1px solid var(--gold);display:grid}.score div{padding:22px;text-align:center}.score div+div{border-top:1px solid var(--gold)}
.score b{display:block;font:400 42px 'Limelight';color:var(--gold2)}.score span{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font:400 11px 'Jost';letter-spacing:.3em;text-transform:uppercase;color:var(--gold);text-align:left;padding:10px;border-bottom:1px solid var(--gold)}
.tbl td{padding:18px 10px;border-bottom:1px solid #d8b05a33}.tbl .t{font:400 20px 'Limelight';color:var(--gold2)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--gold)}
.kpi{padding:26px;text-align:center}.kpi+.kpi{border-left:1px solid var(--gold)}
.kpi b{display:block;font:400 44px 'Limelight';color:var(--gold2)}.kpi span{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.bars{display:flex;gap:16px;justify-content:center;align-items:flex-end;height:220px;margin-bottom:64px}
.bar{width:90px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.bar i{display:block;width:100%;height:calc(var(--v)*.78);background:linear-gradient(var(--rc),color-mix(in srgb,var(--rc) 55%,#000));clip-path:polygon(0 100%,0 14%,50% 0,100% 14%,100% 100%);transition:height .4s}
.bar b{font:400 20px 'Limelight';color:var(--gold2)}.bar span{position:absolute;top:100%;margin-top:10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);width:130%;text-align:center}
@media(max-width:780px){.top .cta{position:static;margin-top:14px}.checkout,.profile,.kpis{grid-template-columns:1fr}.kpi+.kpi{border-left:none;border-top:1px solid var(--gold)}.booking{grid-template-columns:1fr}.acts{justify-content:flex-start}.bar{width:60px}}
</style>
</head>
<body>
<div id="app"></div>
<script>window.BRAND='Gran Teatro de los Enigmas'</script>
<script src="shared.js"></script>
</body>
</html>
